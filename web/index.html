<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ninfer-view</title>
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --border: #30363d;
  --text: #c9d1d9; --dim: #8b949e; --accent: #58a6ff;
  --green: #3fb950; --amber: #d29922; --red: #f85149;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}

header {
  display: flex; align-items: center; gap: 14px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.badge {
  display: inline-flex; align-items: center; gap: 7px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; font-size: 12px; color: var(--dim);
}
.badge .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
.badge.running .dot { background: var(--green); animation: pulse 1.6s infinite; }
.badge.running { color: var(--green); }
.badge.starting .dot, .badge.loading .dot, .badge.warming .dot {
  background: var(--amber); animation: pulse 1s infinite; }
.badge.starting, .badge.loading, .badge.warming { color: var(--amber); }
.badge.crashed .dot { background: var(--red); }
.badge.crashed { color: var(--red); }
.badge.attached .dot { background: var(--accent); }
.badge.attached { color: var(--accent); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.meta { color: var(--dim); font-size: 13px; }
.meta b { color: var(--text); font-weight: 500; }
.spacer { flex: 1; }
button {
  font: inherit; font-size: 13px; font-weight: 600; padding: 6px 18px;
  border-radius: 6px; border: 1px solid var(--border); background: #21262d;
  color: var(--text); cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--dim); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: #238636; border-color: #2ea043; color: #fff; }
button.danger { background: #42191b; border-color: #f8514966; color: var(--red); }

#progress { display: none; padding: 12px 16px; background: var(--panel);
  border-bottom: 1px solid var(--border); }
#progress .bar { height: 8px; border-radius: 4px; background: #21262d;
  overflow: hidden; margin-top: 8px; }
#progress .bar i { display: block; height: 100%; width: 0%;
  background: var(--accent); transition: width .5s; }
#progress .plabel { color: var(--dim); font-size: 12px;
  display: flex; gap: 18px; flex-wrap: wrap; }

#attachForm { display: none; padding: 10px 16px; gap: 8px; align-items: center;
  background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
#attachForm label { color: var(--dim); font-size: 12px; display: inline-flex;
  gap: 6px; align-items: center; }
#attachForm input {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text); padding: 5px 8px; font: 12px var(--mono);
}
#attachForm input.wide { flex: 1 1 320px; min-width: 220px; }
#health { font-size: 12px; color: var(--dim); }
#health.up { color: var(--green); }
#health.down { color: var(--red); }

#logwrap { flex: 1; display: flex; flex-direction: column; min-height: 0;
  padding: 10px 16px 14px; gap: 8px; }
#logbar { display: flex; gap: 10px; align-items: center; }
#filter {
  flex: 0 1 280px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); padding: 5px 10px; font: 12px var(--mono);
}
#logbar .hint { color: var(--dim); font-size: 12px; }
#log {
  flex: 1; overflow-y: auto; background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px; font: 12px/1.5 var(--mono);
  white-space: pre-wrap; word-break: break-word;
}
#log .line { display: flex; gap: 8px; }
#log .ts { color: #484f58; flex: 0 0 auto; }
#log .label {
  flex: 0 0 52px; font-weight: 700; text-transform: uppercase;
  font-size: 10px; letter-spacing: .05em; padding-top: 2px; color: var(--dim);
}
#log .msg { flex: 1; }
#log .k-server .msg { color: #d2a8ff; }
#log .k-server .label { color: #d2a8ff; }
#log .k-start .msg { color: #a5d6ff; }
#log .k-start .label { color: #a5d6ff; }
#log .k-done .msg { color: var(--text); }
#log .k-reject .msg, #log .k-error .msg { color: var(--red); }
#log .k-reject .label, #log .k-error .label { color: var(--red); }
#log .k-thru .msg { color: var(--dim); }
#log .empty { color: #484f58; font-style: italic; }
</style>
</head>
<body>
<header>
  <span class="badge stopped" id="badge"><span class="dot"></span><span id="stateText">STOPPED</span></span>
  <span class="meta" id="meta">no instance</span>
  <span class="spacer"></span>
  <span id="health"></span>
  <span class="meta" id="uptime"></span>
  <button class="primary" id="startBtn">Start</button>
  <button id="attachBtn">Attach</button>
  <button class="danger" id="stopBtn" disabled>Stop</button>
</header>

<div id="attachForm">
  <label>host <input id="attHost" value="127.0.0.1" size="12"></label>
  <label>port <input id="attPort" value="8081" size="6"></label>
  <label>requests.jsonl
    <input id="attJsonl" class="wide" placeholder="/path/to/requests.jsonl"
      spellcheck="false"></label>
  <button class="primary" id="attGo">Go</button>
  <button id="attCancel">Cancel</button>
  <span class="hint">observes an external instance: live-only JSONL tail + /health polling</span>
</div>

<div id="progress">
  <div class="plabel">
    <span id="progPhase">loading&hellip;</span>
    <span id="progPct"></span>
    <span id="progBytes"></span>
    <span id="progElapsed"></span>
  </div>
  <div class="bar"><i id="progFill"></i></div>
</div>

<div id="logwrap">
  <div id="logbar">
    <span class="hint">log &middot; requests.jsonl (live)</span>
    <input id="filter" placeholder="filter log&hellip;" autocomplete="off" spellcheck="false">
    <span class="hint" id="count">0 events</span>
    <span class="spacer"></span>
    <span class="hint" id="runDir"></span>
  </div>
  <div id="log"></div>
</div>

<script>
"use strict";
/* The log stream is fed only by the child's --request-log-jsonl file
 * (schema v10). stderr drives the state machine / progress bar only.
 * Hover a line for the full raw record. */
const $ = (id) => document.getElementById(id);
const logEl = $("log"), badge = $("badge"), stateText = $("stateText");
const metaEl = $("meta"), uptimeEl = $("uptime"), progEl = $("progress");
const startBtn = $("startBtn"), stopBtn = $("stopBtn"), attachBtn = $("attachBtn");
const entries = [];                       // {ts, kind, label, text, rec}
const MAX = 4000;
let pinned = true;
let lastState = { state: "stopped" };

logEl.addEventListener("scroll", () => {
  pinned = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
});

// ---- formatters (schema v10) ------------------------------------------

const f0 = (x) => x == null ? "\u2014" : String(Math.round(Number(x)));
const f1 = (x) => x == null ? "\u2014" : Number(x).toFixed(1);
const f2 = (x) => x == null ? "\u2014" : Number(x).toFixed(2);
const rate = (tok, s) => (tok > 0 && s > 0) ? (tok / s).toFixed(1) + "tok/s" : "n/a";
const kb = (x) => x == null ? "\u2014"
  : (x >= 1e6 ? (x / 1e6).toFixed(2) + "M" : Math.round(x / 1e3) + "k");

function tsOf(ms) {
  const d = new Date(ms);
  const p = (n, w = 2) => String(n).padStart(w, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds())
       + "." + p(d.getMilliseconds(), 3);
}

function fmtServerStart(r) {
  const s = r.server || {}, e = r.engine || {}, a = r.artifact || {},
        env = r.environment || {};
  const p = [
    "model=" + (s.public_model_id || "\u2014"),
    "http://" + s.host + ":" + s.port,
    "ctx=" + f0(e.max_context),
    "kv=" + e.kv_capacity_mode + " " + kb(e.kv_capacity) + " tok",
    "conc=" + e.max_concurrency,
    "kv_cache=" + (e.kv_cache || "\u2014"),
  ];
  if (e.speculative_backend && e.speculative_backend !== "none")
    p.push("spec=" + e.speculative_backend + " draft=" + e.speculative_draft_window);
  if (env.gpu_name) p.push(env.gpu_name);
  if (a.load_seconds != null) p.push("load=" + f1(a.load_seconds) + "s");
  p.push("instance=" + r.server_instance_id);
  return p.join(" \u00b7 ");
}

function fmtRequestStart(r) {
  const q = r.request || {}, pr = r.preparation_seconds || {};
  const p = [
    (q.protocol || "?") + " " + (q.stream ? "stream" : "non-stream"),
    "thinking=" + (q.enable_thinking ? "on" : "off"),
    "budget=" + q.requested_output_tokens +
      "(" + (q.requested_output_tokens_source === "client" ? "client" : "default") + ")",
  ];
  if (q.message_count) p.push("msgs=" + q.message_count);
  if (q.media_item_count) p.push("media=" + q.media_item_count);
  if (q.tool_count) p.push("tools=" + q.tool_count);
  if (pr.total > 0.001) p.push("prepare=" + (pr.total * 1000).toFixed(1) + "ms");
  return p.join(" \u00b7 ");
}

function fmtRequestDone(r) {
  const q = r.request || {}, res = r.result || {}, t = r.timings_seconds || {},
        sp = r.speculative || {};
  const gen = res.completion_tokens || 0;
  const decodeTok = gen > 0 ? gen - 1 : 0;   // prefill emits the first token
  const p = [
    "done " + (res.finish_reason || "\u2014"),
    "prompt=" + (res.prompt_tokens != null ? res.prompt_tokens : "\u2014"),
    "gen=" + gen,
    "cache=" + (res.prefix_cache_hit_tokens || 0),
    "reuse=" + (res.prefix_reuse_path || "\u2014"),
    "ttft=" + ((t.ttft || 0) * 1000).toFixed(0) + "ms",
    "prefill=" + rate(res.computed_prefill_tokens, t.prefill),
    "decode=" + rate(decodeTok, t.decode),
    "wall=" + f2(t.total) + "s",
  ];
  if (res.tool_call_count) p.push("tool_calls=" + res.tool_call_count);
  if (sp.backend && sp.backend !== "none" && sp.rounds > 0) {
    const per = 1 + sp.accepted_tokens / sp.rounds;
    const s = "spec=" + sp.backend + " " + per.toFixed(2) + "tok/round";
    p.push(sp.drafted_tokens > 0
      ? s + " (" + (100 * sp.accepted_tokens / sp.drafted_tokens).toFixed(1) + "%)"
      : s);
  }
  return p.join(" \u00b7 ");
}

function fmtRequestRejected(r) {
  const e = r.error || {};
  return ("REJECTED " + (e.status != null ? e.status : "?") + " " +
          (e.code || e.type || "") + " " + (e.message || "")).replace(/\s+/g, " ").trim();
}

function fmtRequestError(r) {
  return "ERROR " + (r.error && r.error.message ? r.error.message : "unknown");
}

function fmtThroughput(r) {
  const t = r.throughput_tokens_per_second || {}, s = r.scheduler || {},
        b = r.decode_batch || {};
  return "throughput " + f1(r.interval_seconds) + "s \u00b7 "
    + "prefill=" + f1(t.prefill) + "tok/s decode=" + f1(t.decode) + "tok/s \u00b7 "
    + "running=" + (s.running != null ? s.running : 0)
    + " prefilling=" + (s.prefilling != null ? s.prefilling : 0)
    + " decode_ready=" + (s.decode_ready != null ? s.decode_ready : 0)
    + " waiting=" + (s.waiting != null ? s.waiting : 0) + " \u00b7 "
    + "batch=" + (b.average_size != null ? f2(b.average_size) : "n/a");
}

const KIND_LABEL = {
  server_start: "server", request_start: "start", request_rejected: "reject",
  request_done: "done", request_error: "error", throughput: "thru",
};
const KIND_CLASS = {
  server_start: "k-server", request_start: "k-start",
  request_rejected: "k-reject", request_done: "k-done",
  request_error: "k-error", throughput: "k-thru",
};
const FORMATTERS = {
  server_start: fmtServerStart, request_start: fmtRequestStart,
  request_rejected: fmtRequestRejected, request_done: fmtRequestDone,
  request_error: fmtRequestError, throughput: fmtThroughput,
};

function makeEntry(rec) {
  const kind = rec.event || "unknown";
  const fmt = FORMATTERS[kind];
  let text = fmt ? fmt(rec) : JSON.stringify(rec);
  const id = rec.request && rec.request.request_id;
  if (id != null && kind !== "server_start" && kind !== "throughput")
    text = "[req " + id + "] " + text;
  return { ts: rec.timestamp_unix_ms || Date.now(), kind,
           label: KIND_LABEL[kind] || kind, text, rec };
}

// ---- log pane rendering -------------------------------------------------

function lineNode(e) {
  const div = document.createElement("div");
  div.className = "line " + (KIND_CLASS[e.kind] || "");
  const ts = document.createElement("span"); ts.className = "ts";
  ts.textContent = tsOf(e.ts);
  const label = document.createElement("span"); label.className = "label";
  label.textContent = e.label;
  const msg = document.createElement("span"); msg.className = "msg";
  msg.textContent = e.text;
  div.append(ts, label, msg);
  div.title = "raw record:\n" + JSON.stringify(e.rec, null, 2);
  return div;
}

function applyFilter() {
  const f = $("filter").value.trim().toLowerCase();
  logEl.textContent = "";
  const frag = document.createDocumentFragment();
  let n = 0;
  for (const e of entries) {
    if (f && !e.text.toLowerCase().includes(f)) continue;
    frag.appendChild(lineNode(e)); n++;
  }
  if (n === 0) {
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = entries.length === 0
      ? "\u2014 no events yet; the log stream is the instance's requests.jsonl \u2014"
      : "\u2014 no events match the filter \u2014";
    frag.appendChild(d);
  }
  logEl.appendChild(frag);
  $("count").textContent = n + (n === 1 ? " event" : " events");
  if (pinned) logEl.scrollTop = logEl.scrollHeight;
}

function addEntry(e) {
  entries.push(e);
  if (entries.length > MAX) entries.splice(0, entries.length - MAX);
  const f = $("filter").value.trim().toLowerCase();
  if (!f || e.text.toLowerCase().includes(f)) {
    logEl.appendChild(lineNode(e));
    if (pinned) logEl.scrollTop = logEl.scrollHeight;
  }
  $("count").textContent = entries.length + " events";
}

// ---- state header ---------------------------------------------------------

function fmtUp(s) {
  if (s == null) return "";
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + "h " : "") + m + "m " + sec + "s up";
}

function applyState(s) {
  lastState = s || lastState;
  const st = lastState.state || "stopped";
  badge.className = "badge " + st;
  stateText.textContent = st.toUpperCase();
  startBtn.disabled = !["stopped", "crashed"].includes(st);
  attachBtn.disabled = !["stopped", "crashed"].includes(st);
  stopBtn.disabled = !["starting", "loading", "warming", "running",
                       "attached"].includes(st);
  stopBtn.textContent = st === "attached" ? "Detach" : "Stop";

  const hEl = $("health");
  hEl.textContent = lastState.health ? "health: " + lastState.health : "";
  hEl.className = lastState.health || "";

  const bits = [];
  if (lastState.model_id) bits.push("<b>" + lastState.model_id + "</b>");
  if (lastState.endpoint) bits.push(lastState.endpoint);
  if (lastState.pid != null) bits.push("pid " + lastState.pid);
  if (lastState.exit_code != null) bits.push("exit " + lastState.exit_code);
  if (lastState.error) bits.push("\u26a0 " + lastState.error);
  metaEl.innerHTML = bits.length ? bits.join(" \u00b7 ") : "no instance";
  $("runDir").textContent = lastState.run_dir ||
    (lastState.attached ? "jsonl: " + (lastState.jsonl_path || "") : "");

  if ((st === "loading" || st === "starting") && lastState.progress) {
    const p = lastState.progress;
    progEl.style.display = "block";
    $("progPhase").textContent = "loading \u00b7 " + (p.phase || "");
    $("progPct").textContent = p.percent != null ? p.percent.toFixed(1) + "%" : "";
    $("progBytes").textContent = p.total ? p.done + " / " + p.total : (p.done || "");
    $("progElapsed").textContent =
      p.elapsed_s != null ? p.elapsed_s.toFixed(0) + " s elapsed" : "";
    $("progFill").style.width = (p.percent == null ? 4 : p.percent) + "%";
  } else if (st === "warming") {
    progEl.style.display = "block";
    $("progPhase").textContent = "warming up\u2026";
    $("progPct").textContent = ""; $("progBytes").textContent = "";
    $("progElapsed").textContent = "";
    $("progFill").style.width = "100%";
  } else {
    progEl.style.display = "none";
  }
}

function tick() {
  const now = Date.now() / 1000;
  if (lastState.state === "running" && lastState.running_at) {
    uptimeEl.textContent = fmtUp(now - lastState.running_at);
  } else if (lastState.started_at &&
             ["starting", "loading", "warming", "attached"].includes(lastState.state)) {
    uptimeEl.textContent = (lastState.state === "attached" ? "observing " : "started ")
      + Math.round(now - lastState.started_at) + "s ago";
  } else {
    uptimeEl.textContent = "";
  }
}

// ---- live stream -----------------------------------------------------------

const LOG_KINDS = ["server_start", "request_start", "request_rejected",
                   "request_done", "request_error", "throughput"];

function connect() {
  const es = new EventSource("/api/stream");
  es.addEventListener("state", (ev) => { applyState(JSON.parse(ev.data)); tick(); });
  for (const kind of LOG_KINDS) {
    es.addEventListener(kind, (ev) => {
      const d = JSON.parse(ev.data);
      addEntry(makeEntry(d.record));
    });
  }
  es.addEventListener("error", () => {
    // EventSource reconnects on its own; re-backfill history on failure.
    fetch("/api/logs?limit=2000").then((r) => r.json()).then((d) => {
      entries.length = 0;
      for (const e of d.logs) entries.push(makeEntry(e.record));
      applyFilter();
    }).catch(() => {});
  });
}

startBtn.onclick = async () => {
  startBtn.disabled = true;
  const r = await fetch("/api/start", { method: "POST",
    body: JSON.stringify({ profile_id: "default" }) });
  const d = await r.json();
  if (!d.ok) alert("start failed: " + (d.error || r.status));
};
stopBtn.onclick = async () => {
  stopBtn.disabled = true;
  const detach = lastState.state === "attached";
  const r = await fetch(detach ? "/api/detach" : "/api/stop", { method: "POST" });
  const d = await r.json();
  if (!d.ok) alert((detach ? "detach: " : "stop: ") + (d.error || r.status));
};

const attachForm = $("attachForm");
attachBtn.onclick = () => {
  attachForm.style.display = attachForm.style.display === "flex" ? "none" : "flex";
  if (attachForm.style.display === "flex") $("attJsonl").focus();
};
$("attCancel").onclick = () => { attachForm.style.display = "none"; };
$("attGo").onclick = async () => {
  const host = $("attHost").value.trim() || "127.0.0.1";
  const port = parseInt($("attPort").value, 10) || 8081;
  const jsonl_path = $("attJsonl").value.trim();
  if (!jsonl_path) { $("attJsonl").focus(); return; }
  attachBtn.disabled = true;
  const r = await fetch("/api/attach", { method: "POST",
    body: JSON.stringify({ host, port, jsonl_path }) });
  const d = await r.json();
  if (!d.ok) { alert("attach failed: " + (d.error || r.status)); return; }
  attachForm.style.display = "none";
};
$("filter").addEventListener("input", applyFilter);

// Backfill + initial state, then go live.
fetch("/api/state").then((r) => r.json()).then(applyState).catch(() => {});
fetch("/api/logs?limit=2000").then((r) => r.json()).then((d) => {
  for (const e of d.logs) entries.push(makeEntry(e.record));
  applyFilter();
}).catch(() => {});
setInterval(tick, 1000);
connect();
</script>
</body>
</html>
